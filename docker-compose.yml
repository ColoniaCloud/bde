# PostgreSQL para Boutique del Este.
#
#   docker compose up -d
#
# Sólo levanta la base. La aplicación corre con PM2 o systemd fuera de Docker,
# como describe DEPLOYMENT.md. El puerto queda publicado en 127.0.0.1 a
# propósito: la base no debe ser alcanzable desde internet.

services:
  db:
    image: postgres:16-alpine
    container_name: boutique-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boutique}
      POSTGRES_USER: ${POSTGRES_USER:-boutique}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en .env}
      # Sin esto, un volumen recreado queda con autenticación trust.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - boutique-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-boutique} -d ${POSTGRES_DB:-boutique}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  boutique-db-data:
    name: boutique-db-data
