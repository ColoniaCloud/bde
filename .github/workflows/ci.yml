name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido gastar minutos validando un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest

    # Payload necesita una base para compilar y para correr las migraciones,
    # así que el CI levanta una de verdad en lugar de simularla.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boutique_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/boutique_ci
      # Secreto descartable, sólo para que el build arranque en CI.
      PAYLOAD_SECRET: ci-secret-no-usar-en-produccion-000000000000
      # El build incrusta estas dos en el bundle del cliente, así que sin ellas
      # falla. Son valores públicos de ejemplo: alcanzan para compilar y no
      # tocan ningún proyecto real de Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Migraciones
        run: npm run payload migrate

      - name: Build
        run: npm run build

      # Prueba que la carga del catálogo funciona de punta a punta contra una
      # base vacía: si el esquema y el archivo se desincronizan, se ve acá.
      - name: Cargar el catálogo
        run: npm run catalog:seed

      - name: Crear el usuario del panel para las pruebas
        run: npm run admin:create
        env:
          ADMIN_EMAIL: e2e@ejemplo.com
          ADMIN_PASSWORD: clave-solo-para-ci-12345
          ADMIN_NAME: CI

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000 --timeout 90000
          npx playwright test
        env:
          E2E_ADMIN_EMAIL: e2e@ejemplo.com
          E2E_ADMIN_PASSWORD: clave-solo-para-ci-12345

      - name: Guardar el informe si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
